# 탄지무림 — 검사 + 안드로이드 빌드 (+ 원할 때 구글 플레이 올리기)
#
# 비밀값(저장소 Settings → Secrets and variables → Actions)
#   ANDROID_KEYSTORE_BASE64   업로드 키(.jks)를 base64 로 바꾼 값
#   ANDROID_KEYSTORE_PASSWORD 키 저장소 비밀번호
#   ANDROID_KEY_ALIAS         키 별칭
#   ANDROID_KEY_PASSWORD      키 비밀번호
#   PLAY_SERVICE_ACCOUNT_JSON 구글 플레이 올리기용 서비스 계정 JSON (올리기를 쓸 때만)
#   TELEGRAM_BOT_TOKEN        새 시험판 링크를 보낼 텔레그램 봇 토큰 (선택)
#   TELEGRAM_CHAT_ID          받을 대화 번호 (선택)
# 업로드 키가 등록돼 있으면 main 에 들어올 때마다 휴대폰(arm64) 시험판을 고정 링크
#   https://github.com/<저장소>/releases/download/test-latest/tanji-murim-test.apk
# 에 올린다. 늘 같은 키·더 큰 빌드 번호라 휴대폰에서 지우지 않고 업데이트로 깔린다.
# 업로드 키가 없으면 디버그 키로 서명한 시험용 APK 만 만든다(플레이에는 못 올림).
# make_release 를 켜면 APK·AAB 를 시험판 릴리스(build-번호)에도 올린다 — 산출물(artifact)
# 저장소에 닿지 못하는 곳에서 파일을 받아 업로드 키로 따로 서명할 때 쓴다.
name: app

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      play_track:
        description: '구글 플레이 트랙(비우면 올리지 않음): internal / alpha / beta / production'
        required: false
        default: ''
      play_status:
        description: '출시 상태: completed(바로 출시) / draft(초안으로만)'
        required: false
        default: draft
      make_release:
        description: 'APK·AAB 를 시험판 릴리스(build-번호)로도 올림'
        type: boolean
        required: false
        default: false

env:
  FLUTTER_VERSION: 3.47.6

# 기본은 읽기만. 쓰기가 필요한 작업(release·test-latest)만 따로 연다.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: 물리 패키지 검사·시험
        working-directory: packages/physics
        run: |
          dart pub get
          dart format --output=none --set-exit-if-changed .
          dart analyze --fatal-infos
          dart test
      - name: 앱 검사·시험
        working-directory: app
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --fatal-infos
          flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      build_number: ${{ steps.bn.outputs.build_number }}
      signed: ${{ steps.key.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # PR 빌드에는 업로드 키를 주지 않는다(PR 이 워크플로·Gradle 을 바꿔 키를 빼내지 못하게 · 2026-10-11 점검).
      # PR 은 디버그 키로 빌드만 확인하고, 업로드 키 서명은 main 과 손으로 돌릴 때만.
      - name: 업로드 키 준비
        id: key
        env:
          KEYSTORE_B64: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ALKKAGI_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "업로드 키로 서명합니다."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::업로드 키 비밀값이 없어 디버그 키로 서명합니다(플레이에 올릴 수 없음)."
          fi
      - name: 빌드 번호 = 실행 번호 · 판 이름 = pubspec
        id: bn
        run: |
          echo "BUILD_NUMBER=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "build_number=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"
          echo "VERSION_NAME=$(sed -nE 's/^version: *([^+]+).*/\1/p' app/pubspec.yaml)" >> "$GITHUB_ENV"
      - name: APK·AAB 빌드
        working-directory: app
        env:
          ALKKAGI_KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ALKKAGI_KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_ALIAS || '' }}
          ALKKAGI_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: |
          flutter pub get
          DEFS="--build-number $BUILD_NUMBER --dart-define=APP_VERSION=$VERSION_NAME --dart-define=APP_BUILD=$BUILD_NUMBER"
          mkdir -p "$RUNNER_TEMP/out"
          # 스토어 판(play): 업데이트 기능·인터넷 권한 없음. 모든 기기용 APK 와 AAB.
          flutter build apk --release --flavor play $DEFS --dart-define=APP_CHANNEL=play
          cp build/app/outputs/flutter-apk/app-play-release.apk "$RUNNER_TEMP/out/tanji-murim-$BUILD_NUMBER.apk"
          flutter build appbundle --release --flavor play $DEFS --dart-define=APP_CHANNEL=play
          cp build/app/outputs/bundle/playRelease/app-play-release.aab "$RUNNER_TEMP/out/tanji-murim-$BUILD_NUMBER.aab"
          # 휴대폰 시험판(sideload): arm64 전용, 켤 때 스스로 업데이트한다.
          # versionCode = 2000 + 빌드 번호(Flutter 의 ABI 배수). 시험판은 늘 이 파일로 업데이트한다.
          flutter build apk --release --flavor sideload --split-per-abi $DEFS --dart-define=APP_CHANNEL=sideload
          cp build/app/outputs/flutter-apk/app-arm64-v8a-sideload-release.apk "$RUNNER_TEMP/out/tanji-murim-$BUILD_NUMBER-arm64.apk"
          ls -la "$RUNNER_TEMP/out"
      - name: APK 점검(권한·물리 엔진 포함 여부)
        run: |
          APK="$RUNNER_TEMP/out/tanji-murim-$BUILD_NUMBER.apk"
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT2" dump badging "$APK" | grep -E "^package:|^application-label|^sdkVersion|^targetSdkVersion"
          echo "--- 권한 ---"
          "$AAPT2" dump permissions "$APK"
          echo "--- 네이티브 라이브러리 ---"
          unzip -l "$APK" | grep '\.so$'
          # 스토어 판에는 인터넷·설치 권한이 하나도 없어야 한다(데이터 보안 답변 · 플레이 정책).
          for p in android.permission.INTERNET android.permission.REQUEST_INSTALL_PACKAGES android.permission.UPDATE_PACKAGES_WITHOUT_USER_ACTION; do
            if "$AAPT2" dump permissions "$APK" | grep -q "$p"; then
              echo "::error::출시 빌드에 $p 권한이 들어 있습니다"; exit 1
            fi
          done
          # 플레이가 요구하는 대상 SDK(35 이상).
          TSDK=$("$AAPT2" dump badging "$APK" | sed -nE "s/^targetSdkVersion:'([0-9]+)'.*/\1/p")
          [ "${TSDK:-0}" -ge 35 ] || { echo "::error::targetSdkVersion=$TSDK (35 이상이어야 함)"; exit 1; }
          # 세로 고정(태블릿 밖에서는 가로로 열리지 않게).
          "$AAPT2" dump xmltree --file AndroidManifest.xml "$APK" | grep -q 'screenOrientation' || { echo "::error::세로 고정(screenOrientation)이 없습니다"; exit 1; }
          unzip -l "$APK" | grep -q 'arm64-v8a/libbox2d' || { echo "::error::arm64 물리 엔진 라이브러리가 없습니다"; exit 1; }
          echo "--- 휴대폰(arm64) 전용 APK ---"
          ARM="$RUNNER_TEMP/out/tanji-murim-$BUILD_NUMBER-arm64.apk"
          "$AAPT2" dump badging "$ARM" | grep -E "^package:"
          unzip -l "$ARM" | grep '\.so$'
          unzip -l "$ARM" | grep -q 'arm64-v8a/libbox2d' || { echo "::error::arm64 전용 APK 에 물리 엔진이 없습니다"; exit 1; }
          echo "--- 시험판 권한(스스로 업데이트) ---"
          "$AAPT2" dump permissions "$ARM" | tee arm-perm.txt
          for p in android.permission.INTERNET android.permission.REQUEST_INSTALL_PACKAGES android.permission.UPDATE_PACKAGES_WITHOUT_USER_ACTION; do
            grep -q "$p" arm-perm.txt || { echo "::error::시험판에 $p 권한이 없습니다(자동 업데이트 불가)"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ env.BUILD_NUMBER }}
          path: ${{ runner.temp }}/out/
          retention-days: 30
      - name: 구글 플레이에 올리기
        # 업로드 키로 서명된 AAB 만 올린다(디버그 서명 AAB 는 플레이가 거절한다).
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.play_track != '' && steps.key.outputs.signed == 'true' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: TTong.alkkagi
          releaseFiles: ${{ runner.temp }}/out/tanji-murim-${{ env.BUILD_NUMBER }}.aab
          track: ${{ inputs.play_track }}
          status: ${{ inputs.play_status }}

  # 쓰기 권한은 이 작업에만 준다(수동 실행 + make_release 일 때만 돈다).
  # 업로드 키로 서명된 빌드만 올린다 — 임시 키 판이 올라가면 받은 폰에서 정식 판 설치가 막힌다.
  release:
    needs: android
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.make_release && needs.android.outputs.signed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-${{ needs.android.outputs.build_number }}
          path: out
      - name: 시험판 릴리스에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_NUMBER: ${{ needs.android.outputs.build_number }}
        run: |
          TAG="build-$BUILD_NUMBER"
          ls -la out
          gh release create "$TAG" out/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "시험판 $TAG" \
            --notes "자동 빌드 $TAG (커밋 $GITHUB_SHA). 플레이 업로드용 AAB 는 업로드 키로 따로 서명한다."

  # 고정 링크(test-latest)에 휴대폰 시험판을 올리고 텔레그램으로 알린다.
  # 업로드 키로 서명된 빌드만 올린다 — 다른 키가 올라가면 휴대폰에서 업데이트가 막힌다.
  test-latest:
    needs: android
    if: >-
      ${{ needs.android.outputs.signed == 'true' &&
          ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
           (github.event_name == 'workflow_dispatch' && inputs.make_release)) }}
    runs-on: ubuntu-latest
    concurrency: test-latest
    permissions:
      contents: write
    env:
      # 업로드 키 인증서 SHA-256 (공개 정보). 이 키가 아니면 올리지 않는다.
      UPLOAD_CERT_SHA256: 90dbee10f71a1ebca7365d85d5d9eccebd08f5a07f350b46bd4179d6f79d8ab0
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-${{ needs.android.outputs.build_number }}
          path: out
      - name: 서명 키 확인
        env:
          BUILD_NUMBER: ${{ needs.android.outputs.build_number }}
        run: |
          APK="out/tanji-murim-$BUILD_NUMBER-arm64.apk"
          SIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$SIGNER" verify --print-certs "$APK" | tee certs.txt
          GOT=$(sed -nE 's/.*certificate SHA-256 digest: ([0-9a-f]+).*/\1/p' certs.txt | head -1)
          WANT=$(echo "$UPLOAD_CERT_SHA256" | tr -d ' ')
          if [ "$GOT" != "$WANT" ]; then
            echo "::error::업로드 키가 아닌 키로 서명됨($GOT). 고정 링크에 올리지 않습니다."; exit 1
          fi
          cp "$APK" tanji-murim-test.apk
      # 늦게 끝난 옛 실행이 새 판을 덮지 않게: 지금 올라가 있는 번호보다 클 때만 올린다.
      - name: 더 새 판인지 확인
        id: newer
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_NUMBER: ${{ needs.android.outputs.build_number }}
        run: |
          CUR=0
          if gh release download test-latest --repo "$GITHUB_REPOSITORY" --pattern version.json --output cur.json 2>/dev/null; then
            CUR=$(python3 -c "import json; print(int(json.load(open('cur.json')).get('build', 0)))" || echo 0)
          fi
          echo "올라가 있는 판: $CUR · 이번 판: $BUILD_NUMBER"
          if [ "$BUILD_NUMBER" -gt "$CUR" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "go=false" >> "$GITHUB_OUTPUT"; echo "::notice::더 새 판($CUR)이 이미 있어 올리지 않습니다."; fi
      - name: 바뀐 점 한 줄 · version.json
        if: ${{ steps.newer.outputs.go == 'true' }}
        env:
          BUILD_NUMBER: ${{ needs.android.outputs.build_number }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # 손으로 돌린 실행에는 head_commit 이 없다 → 그 커밋 메시지를 직접 읽는다.
          if [ -z "$HEAD_MSG" ]; then
            HEAD_MSG=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq .commit.message || true)
          fi
          # 병합 커밋이면 첫 줄(Merge pull request …) 대신 PR 제목 줄을 쓴다.
          WHAT=$(printf '%s\n' "$HEAD_MSG" | awk 'NF && !/^Merge pull request/ {print; exit}')
          printf '%s' "$WHAT" > what.txt
          LINK="https://github.com/$GITHUB_REPOSITORY/releases/download/test-latest/tanji-murim-test.apk"
          # sha256·size: 앱이 받은 파일을 이 값과 맞춰 본 뒤에만 설치한다(바뀐 파일 설치 막기).
          SHA=$(sha256sum tanji-murim-test.apk | cut -d' ' -f1)
          SIZE=$(stat -c %s tanji-murim-test.apk)
          python3 -c "import json,sys; json.dump({'build': int(sys.argv[1]), 'apk': sys.argv[2], 'sha256': sys.argv[3], 'size': int(sys.argv[4]), 'notes': open('what.txt', encoding='utf-8').read()}, open('version.json', 'w', encoding='utf-8'), ensure_ascii=False)" "$BUILD_NUMBER" "$LINK" "$SHA" "$SIZE"
          cat version.json
      - name: 고정 링크에 올리기
        if: ${{ steps.newer.outputs.go == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_NUMBER: ${{ needs.android.outputs.build_number }}
        run: |
          NOTES="휴대폰(arm64) 시험판 · 빌드 $BUILD_NUMBER (커밋 ${GITHUB_SHA::7}). 깔려 있는 앱 위에 그대로 설치하면 업데이트됩니다."
          if ! gh release view test-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create test-latest --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --prerelease --title "시험판 (늘 최신)" --notes "$NOTES"
          fi
          # APK 먼저, version.json 나중에: 앱이 새 번호를 본 순간 APK 는 이미 새것이다.
          gh release upload test-latest tanji-murim-test.apk --clobber --repo "$GITHUB_REPOSITORY"
          gh release upload test-latest version.json --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit test-latest --repo "$GITHUB_REPOSITORY" --notes "$NOTES"
      - name: 텔레그램 알림
        if: ${{ steps.newer.outputs.go == 'true' }}
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          BUILD_NUMBER: ${{ needs.android.outputs.build_number }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "텔레그램 비밀값이 없어 알림은 건너뜁니다."; exit 0
          fi
          LINK="https://github.com/$GITHUB_REPOSITORY/releases/download/test-latest/tanji-murim-test.apk"
          WHAT=$(cat what.txt)
          TEXT=$(printf '탄지무림 시험판 빌드 %s\n바뀐 점: %s\n\n▶ APK 받기(늘 최신 · 링크 고정)\n%s\n\n• 처음: 링크로 받아 한 번만 설치\n• 그다음: 새로 설치할 필요 없음 — 앱을 켜면 새 판을 스스로 받아 업데이트(처음 한 번 「이 출처 허용」만 켜기)\n• 링크로 다시 받아 깔아도 지우지 않고 그 위에 업데이트(앱 데이터 그대로)' "$BUILD_NUMBER" "${WHAT:-없음}" "$LINK")
          curl -sS -o resp.json "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" --data-urlencode "text=${TEXT}"
          python3 -c "import json,sys; r=json.load(open('resp.json')); print('텔레그램 보냄' if r.get('ok') else '텔레그램 실패: '+str(r.get('description'))); sys.exit(0 if r.get('ok') else 1)"
