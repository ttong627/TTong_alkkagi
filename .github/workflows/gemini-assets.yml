# 재미나이(Gemini API)로 그림·소리 뽑기 — 손으로만 돌린다.
#
# 비밀값: GEMINI_API_KEY (저장소 Settings → Secrets and variables → Actions)
# 결과는 브랜치 gemini-out/<실행 번호> 에 gen_out/ 그대로 올린다(앱에는 사람이 고른 것만 옮긴다).
name: gemini-assets

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'probe(모델·문서 받기) 또는 job:<이름>(tools/gemini/jobs/<이름>.json)'
        required: true
        default: probe
      only:
        description: '(선택) 이 id 만 쉼표로'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: 키 확인
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY 비밀값이 없습니다."; exit 1
          fi
      - name: 뽑기
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TASK: ${{ inputs.task }}
          ONLY: ${{ inputs.only }}
        run: |
          case "$TASK" in
            probe) python3 tools/gemini/run.py probe ;;
            job:*) python3 tools/gemini/run.py job "${TASK#job:}" ;;
            *) echo "알 수 없는 일: $TASK"; exit 1 ;;
          esac
      - name: 결과를 브랜치로
        env:
          RUN: ${{ github.run_number }}
          TASK: ${{ inputs.task }}
        run: |
          [ -d gen_out ] || { echo "결과 없음"; exit 0; }
          git config user.name "gemini-assets"
          git config user.email "gemini-assets@users.noreply.github.com"
          git checkout -b "gemini-out/$RUN"
          git add -f gen_out
          git commit -q -m "재미나이 결과 $RUN ($GITHUB_REF_NAME · $TASK)"
          git push -q origin "gemini-out/$RUN"
          echo "브랜치 gemini-out/$RUN"
